name: Collect Xoso88 results

on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'requirements.txt'
      - '.github/workflows/collect-results.yml'
  workflow_dispatch:
    inputs:
      date:
        description: "Draw date (YYYY-MM-DD); leave empty for today"
        required: false
        default: "2026-09-15"
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: xoso88-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose Supabase key type
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os

          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          if not key:
              raise SystemExit("SUPABASE_SERVICE_ROLE_KEY is empty")

          # Never print the key itself. Only classify its safe public shape and,
          # for legacy JWTs, print the non-secret role claim from the payload.
          parts = key.split(".")
          if len(parts) == 3 and parts[0].startswith("eyJ"):
              payload = parts[1] + "=" * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
              print(f"Supabase key format=legacy-jwt role={claims.get('role', '<missing>')!r}")
              print(f"Supabase key issuer={claims.get('iss', '<missing>')!r}")
          elif key.startswith("sb_secret_"):
              print("Supabase key format=modern-secret-key")
          elif key.startswith("sb_publishable_"):
              print("Supabase key format=modern-publishable-key")
          else:
              print("Supabase key format=unknown")
          PY
      - name: Validate Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import requests

          raw = os.environ["SUPABASE_URL"].strip()
          parsed = urlsplit(raw)
          path = parsed.path.rstrip("/")
          print(f"Supabase scheme={parsed.scheme!r} host={parsed.netloc!r} path={parsed.path!r}")
          assert parsed.scheme == "https", "SUPABASE_URL must use https"
          assert parsed.netloc == "mwdlwvychuolybbfvyem.supabase.co", "SUPABASE_URL host is unexpected"
          assert path in ("", "/rest/v1"), "SUPABASE_URL must be project URL, optionally ending /rest/v1"
          assert not parsed.query and not parsed.fragment, "SUPABASE_URL must not contain query or fragment"
          base = f"{parsed.scheme}://{parsed.netloc}"
          endpoint = base + "/rest/v1/source_fetches?select=id&limit=1"
          response = requests.get(
              endpoint,
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Accept": "application/json",
              },
              timeout=15,
          )
          print(f"Supabase REST probe HTTP status={response.status_code}")
          if response.status_code >= 400:
              print("Supabase REST probe failed; response body is intentionally omitted to avoid leaking data.")
              raise SystemExit(1)
          print("Supabase REST probe succeeded.")
          PY
      - name: Collect regions sequentially
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Required repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are not configured."
            exit 1
          fi
          for region in mien-bac mien-trung mien-nam; do
            echo "Collecting $region"
            if [ -n "$TARGET_DATE" ]; then
              python -m scraper.collect_live --region "$region" --date "$TARGET_DATE"
            else
              python -m scraper.collect_live --region "$region"
            fi
          done
