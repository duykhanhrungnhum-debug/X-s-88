name: Collect Xoso88 results

on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'requirements.txt'
      - '.github/workflows/collect-results.yml'
  workflow_dispatch:
    inputs:
      date:
        description: "Draw date (YYYY-MM-DD); leave empty for today"
        required: false
        default: ""
        type: string
  schedule:
    # 16:07-21:57 Vietnam time (UTC+7). Offset from the top of the hour
    # to reduce GitHub Actions schedule congestion/dropped runs.
    # Manual dispatch remains available for backfills or exceptional delays.
    - cron: "7,17,27,37,47,57 9-14 * * *"

permissions:
  contents: read

concurrency:
  group: xoso88-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose Supabase credential
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os

          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          if not key:
              raise SystemExit("SUPABASE_SERVICE_ROLE_KEY is empty")

          parts = key.split(".")
          if len(parts) == 3 and parts[0].startswith("eyJ"):
              try:
                  payload = parts[1] + "=" * (-len(parts[1]) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Supabase credential looks like a JWT but payload decoding failed: {type(exc).__name__}")
              role = claims.get("role")
              issuer = claims.get("iss")
              print(f"Supabase credential format=legacy-jwt role={role!r} issuer={issuer!r}")
              if role != "service_role":
                  raise SystemExit("SUPABASE_SERVICE_ROLE_KEY is not a legacy service_role JWT")
          elif key.startswith("sb_secret_"):
              print("Supabase credential format=modern-secret-key")
          elif key.startswith("sb_publishable_"):
              raise SystemExit("SUPABASE_SERVICE_ROLE_KEY contains a publishable key, not a server-side secret")
          else:
              raise SystemExit("SUPABASE_SERVICE_ROLE_KEY has an unknown key format")
          PY
      - name: Validate Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import requests

          raw = os.environ["SUPABASE_URL"].strip()
          parsed = urlsplit(raw)
          path = parsed.path.rstrip("/")
          print(f"Supabase scheme={parsed.scheme!r} host={parsed.netloc!r} path={parsed.path!r}")
          assert parsed.scheme == "https", "SUPABASE_URL must use https"
          assert parsed.netloc == "mwdlwvychuolybbfvyem.supabase.co", "SUPABASE_URL host is unexpected"
          assert path in ("", "/rest/v1"), "SUPABASE_URL must be project URL, optionally ending /rest/v1"
          assert not parsed.query and not parsed.fragment, "SUPABASE_URL must not contain query or fragment"
          base = f"{parsed.scheme}://{parsed.netloc}"
          endpoint = base + "/rest/v1/source_fetches?select=id&limit=1"
          response = requests.get(
              endpoint,
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Accept": "application/json",
              },
              timeout=15,
          )
          print(f"Supabase REST probe HTTP status={response.status_code}")
          if response.status_code >= 400:
              print("Supabase REST probe failed; response body is intentionally omitted to avoid leaking data.")
              raise SystemExit(1)
          print("Supabase REST probe succeeded.")
          PY
      - name: Collect regions sequentially
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Required repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are not configured."
            exit 1
          fi
          first=1
          for region in mien-bac mien-trung mien-nam; do
            if [ "$first" -eq 0 ]; then sleep 5; fi
            first=0
            echo "Collecting $region"
            if [ -n "$TARGET_DATE" ]; then
              python -m scraper.collect_live --region "$region" --date "$TARGET_DATE"
            else
              python -m scraper.collect_live --region "$region"
            fi
          done
