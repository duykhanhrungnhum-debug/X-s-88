name: Collect Xoso88 results

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Draw date (YYYY-MM-DD); leave empty for today"
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: xoso88-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect regions sequentially
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Required repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are not configured."
            exit 1
          fi
          for region in mien-bac mien-trung mien-nam; do
            echo "Collecting $region"
            if [ -n "$TARGET_DATE" ]; then
              python -m scraper.collect_live --region "$region" --date "$TARGET_DATE"
            else
              python -m scraper.collect_live --region "$region"
            fi
          done
