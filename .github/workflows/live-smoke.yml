name: Minh Ngoc live smoke

on:
  push:
    branches: [main]
    paths:
      - 'scraper/sources/minhngoc_html.py'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify historical daily parser shape against live source
        run: |
          python - <<'PY'
          from datetime import date
          from scraper.sources.minhngoc_html import build_region_url, fetch_html, parse_html

          target = date(2026, 9, 20)
          expected = {"mien-bac": 1, "mien-trung": 3, "mien-nam": 3}

          for region, expected_count in expected.items():
              url = build_region_url(region, target)
              response = fetch_html(url)
              rows = parse_html(response.content, region, target)
              provinces = sorted({row.province for row in rows})
              print(f"{region}: HTTP={response.status_code} provinces={provinces}")
              if response.status_code != 200:
                  raise SystemExit(f"{region}: unexpected HTTP status")
              if len(provinces) != expected_count:
                  raise SystemExit(
                      f"{region}: expected {expected_count} provinces for {target}, got {len(provinces)}: {provinces}"
                  )
              if region in {"mien-trung", "mien-nam"}:
                  expected_number_counts = {
                      "Giải tám": 1, "Giải bảy": 1, "Giải sáu": 3,
                      "Giải năm": 1, "Giải tư": 7, "Giải ba": 2,
                      "Giải nhì": 1, "Giải nhất": 1, "Giải Đặc Biệt": 1,
                  }
                  for row in rows:
                      want = expected_number_counts[row.prize]
                      if len(row.numbers) != want:
                          raise SystemExit(
                              f"{region} {row.province} {row.prize}: expected {want} number(s), got {len(row.numbers)} {row.numbers}"
                          )
          print("LIVE_SMOKE=PASS")
          PY
