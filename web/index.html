<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5cab">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Xoso88 — Kết quả xổ số</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202733;background:#f1f3f6;--blue:#075baa;--blue2:#0d6fc7;--red:#d71920;--line:#d9dee5;--soft:#f7f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--soft)}
a{color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topbar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:900;color:var(--blue);letter-spacing:-.5px}.tag{font-size:12px;color:#657080}
.nav{background:var(--blue);color:#fff}.navin{max-width:1100px;margin:auto;display:flex;overflow:auto}.nav button{border:0;background:transparent;color:#fff;font-weight:800;padding:12px 18px;white-space:nowrap;cursor:pointer}.nav button.active{background:#084d8d}
.wrap{max-width:1100px;margin:auto;padding:12px 12px 36px}
.tools{background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.datebox{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.datebox button,.datebox input{height:38px;border:1px solid #c9d0d9;background:#fff;border-radius:5px;padding:0 11px;font-weight:700}.datebox button{cursor:pointer}.datebox .today{background:var(--blue);color:#fff;border-color:var(--blue)}
.status{font-size:13px;color:#66717f;text-align:right}
.titlebar{background:#fff;border:1px solid var(--line);border-bottom:3px solid var(--blue);padding:13px 14px;margin-bottom:12px}.titlebar h1{font-size:21px;margin:0;color:#1e2937}.titlebar p{margin:5px 0 0;color:#6a7481;font-size:13px}
.draw{background:#fff;border:1px solid var(--line);margin-bottom:16px;overflow:hidden}.drawhead{background:#eef5fc;border-bottom:1px solid #cbdced;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.province{font-weight:900;color:#0b4f91}.code{font-size:12px;color:#687687}.weekday{font-size:13px;color:#66717f}
table{width:100%;border-collapse:collapse;table-layout:fixed}.prize{width:125px;background:#fafbfc;color:#3c4652;font-weight:800;font-size:13px;text-align:left}.db .prize{color:var(--red)}th,td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}tr:last-child th,tr:last-child td{border-bottom:0}.nums{font-size:19px;font-weight:700;line-height:1.65;text-align:center;word-break:break-word;letter-spacing:.4px}.db .nums{font-size:25px;color:var(--red);font-weight:900}.empty{padding:36px 18px;text-align:center;color:#687483;background:#fff}.empty strong{display:block;color:#2e3947;margin-bottom:6px;font-size:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.quick button{border:1px solid #ccd3dc;background:#fff;border-radius:5px;padding:8px 12px;font-weight:700;cursor:pointer}
.footer{max-width:1100px;margin:auto;padding:10px 12px 30px;color:#7b8490;font-size:12px;text-align:center}
@media(max-width:680px){.topbar{padding:9px 12px}.brand{font-size:22px}.tools{grid-template-columns:1fr}.status{text-align:left}.wrap{padding:8px 7px 28px}.titlebar h1{font-size:18px}.drawhead{align-items:flex-start}.prize{width:82px;font-size:12px}.nums{font-size:16px;line-height:1.55}.db .nums{font-size:22px}.datebox input{width:145px}.nav button{padding:11px 14px}}
</style>
</head>
<body>
<header class="top"><div class="topbar"><div class="brand">Xoso88</div><div class="tag">Kết quả xổ số • dữ liệu xác thực</div></div></header>
<nav class="nav"><div class="navin" role="tablist">
<button class="active" data-region="south">Miền Nam</button><button data-region="central">Miền Trung</button><button data-region="north">Miền Bắc</button>
</div></nav>

<main class="wrap">
<section class="tools">
  <div>
    <div class="datebox">
      <button id="prev" aria-label="Ngày trước">‹ Ngày trước</button>
      <input id="date" type="date">
      <button id="next" aria-label="Ngày sau">Ngày sau ›</button>
      <button id="today" class="today">Hôm nay</button>
    </div>
    <div class="quick"><button data-offset="-1">Hôm qua</button><button data-offset="-7">7 ngày trước</button></div>
  </div>
  <div class="status" id="status">Đang tải…</div>
</section>

<section class="titlebar">
  <h1 id="pageTitle">KẾT QUẢ XỔ SỐ MIỀN NAM</h1>
  <p id="dateTitle">Đang tải dữ liệu đã xác thực…</p>
</section>

<section id="results"><div class="empty"><strong>Đang tải kết quả…</strong>Đang kết nối nguồn dữ liệu xác thực.</div></section>
</main>
<footer class="footer">Xoso88 chỉ hiển thị kết quả đã đi qua FETCHED → PARSED → VALIDATED → PUBLISHED. Không có dữ liệu thật thì không hiển thị số giả.</footer>

<script>
const API_BASE='https://mwdlwvychuolybbfvyem.supabase.co/functions/v1/public-results';
const regionNames={south:'Miền Nam',central:'Miền Trung',north:'Miền Bắc'};
let region='south';
const dateEl=document.getElementById('date');

function isoDate(d){return d.toISOString().slice(0,10)}
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000)}
function setDate(d){dateEl.value=isoDate(d);refresh()}
function shift(days){const d=new Date(dateEl.value+'T12:00:00');d.setDate(d.getDate()+days);setDate(d)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y}
function renderDraw(draw){
  const results=Array.isArray(draw.results)?draw.results:[];
  const rows=results.map(r=>{
    const db=String(r.prize_name||'').toLowerCase().includes('đặc biệt');
    const nums=(r.numbers||[]).map(esc).join(' &nbsp; ');
    return '<tr class="'+(db?'db':'')+'"><th class="prize">'+esc(r.prize_name)+'</th><td class="nums">'+nums+'</td></tr>';
  }).join('');
  return '<article class="draw"><div class="drawhead"><div><div class="province">'+esc(draw.province?.name||draw.province_name||'Xổ số '+regionNames[region])+'</div><div class="code">'+esc(draw.province?.code||draw.province_code||'')+'</div></div><div class="weekday">'+fmtDate(draw.draw_date)+'</div></div><table><tbody>'+rows+'</tbody></table></article>';
}
async function refresh(){
  const selected=dateEl.value;
  document.getElementById('status').textContent='Đang đồng bộ…';
  document.getElementById('pageTitle').textContent='KẾT QUẢ XỔ SỐ '+regionNames[region].toUpperCase();
  document.getElementById('dateTitle').textContent='Ngày '+fmtDate(selected)+' • chỉ hiển thị bản ghi đã xác thực';
  document.getElementById('results').innerHTML='<div class="empty"><strong>Đang tải…</strong>Đang kiểm tra dữ liệu của ngày đã chọn.</div>';
  try{
    const url=API_BASE+'?region='+encodeURIComponent(region)+'&date='+encodeURIComponent(selected)+'&_='+Date.now();
    const res=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const payload=await res.json();
    const draws=Array.isArray(payload.draws)?payload.draws:[];
    document.getElementById('results').innerHTML=draws.length?draws.map(renderDraw).join(''):'<div class="empty"><strong>Chưa có kết quả cho ngày này</strong>Nguồn chưa có bản ghi đã xác thực, hoặc ngày này chưa được thu thập.</div>';
    document.getElementById('status').textContent='Cập nhật '+new Date().toLocaleTimeString('vi-VN');
  }catch(e){
    document.getElementById('results').innerHTML='<div class="empty"><strong>Chưa kết nối được dữ liệu</strong>API chưa trả kết quả. Không hiển thị số giả.</div>';
    document.getElementById('status').textContent='Lỗi kết nối API';
  }
}

dateEl.value=isoDate(localDate());
document.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-region]').forEach(x=>x.classList.remove('active'));b.classList.add('active');region=b.dataset.region;refresh()}));
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>setDate(localDate());
document.querySelectorAll('[data-offset]').forEach(b=>b.onclick=()=>{const d=localDate();d.setDate(d.getDate()+Number(b.dataset.offset));setDate(d)});
dateEl.addEventListener('change',refresh);
refresh();
setInterval(refresh,30000);
</script>
</body>
</html>
